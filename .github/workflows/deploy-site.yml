# Deploys site/ to anvil-md.frst.dev on every push to main that can change it.
# Why: deploys were manual, and the live site sat two months behind main
# (found 2026-11-17: nothing from 29 Sep or 12 Nov was live).
# CLOUDFLARE_API_TOKEN is a scoped token (Workers Scripts + Workers Routes on
# frst.dev only); its source of truth is passage config/cloudflare/anvil-site-deploy-token.
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "packages/**"
      - "SPEC.md"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # The examples page renders through the real packages at build time; a
      # broken block fails the build here instead of shipping.
      - run: bun run build
      - run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
